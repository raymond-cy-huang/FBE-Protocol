# Global path profiles used by task scripts.
#
# Profile naming convention:
# - fbe_extract_multi_masks_path00: repo-local default profile.
# - fbe_extract_multi_masks_path01: external/current experiment profile.
# - Add path02, path03, ... for additional input/output pairs.

# 00 keeps a review-friendly folder structure and writes both outputs:
# results/fbe_extract_multi_masks/{image_name}/{image_name}_mask.png
# results/fbe_extract_multi_masks/{image_name}/{image_name}_combine.png
fbe_extract_multi_masks_path00:
  # Default local test folder.
  input_dir: images
  output_dir: results

  # task: results/fbe_extract_multi_masks/{image_name}/...
  # direct: results/{image_name}/...
  output_layout: task

  # full: write mask + combine
  # mask_only: write mask only
  output_mode: full

# 01 is a flat bulk-output template for downstream experiments.
# Fill in input_dir/output_dir when using it:
# {output_dir}/{image_name}_mask.png
# No task folder, no per-image folder, no combine image.
fbe_extract_multi_masks_path01:
  # Current external test folders.
  # input_dir: your_input_folder
  # output_dir: your_output_folder
  output_layout: direct
  output_mode: mask_only

# Background swapping profiles.
#
# dataset_root mode expects:
# {dataset_root}/gt_mix_gender
# {dataset_root}/gt_female_mask
# {dataset_root}/gt_male_mask
#
# Output should stay task-scoped; per-run parameters belong in run metadata,
# not in folder names.
fbe_background_swapping01:
  dataset_root: /mnt/d/Ph.D/01_Experiments_GAN_Inv_Log/2026.03.08_All_Experiments_Start/_normalized_dataset
  output_dir: results
  output_layout: task

  # Pairing defaults.
  mask_region: background
  min_iou: -1
  anchor_count: 10
  max_pairs: 20
  pair_mask_size: 128
  variant_px: -1

fbe_background_swapping02:
  # dataset_root: /path/to/normalized_dataset
  output_dir: results
  output_layout: task

  # Pairing defaults.
  mask_region: background
  min_iou: -1
  anchor_count: 10
  max_pairs: 20
  pair_mask_size: 128
  variant_px: -1

# Alpha blending profiles.
#
# Mode A: image + mask/soft_mask
# - image: original image. The task splits it into foreground/background first.
# - mask: hard foreground mask; alpha_blending.py creates a soft mask from it.
# - soft_mask: optional precomputed soft foreground mask. Use either mask or soft_mask.
#
# Mode B: foreground + background + mask/soft_mask
# - foreground/background: explicit images to merge with the soft mask.
# - mask/soft_mask: same meaning as above.
alpha_blending_path00:
  image: images/15881.png
  mask: results/fbe_extract_mask/15881/15881_mask.png
  output_dir: results/alpha_blending
  output_layout: task
  output_mode: full
  kernel_size: 31
  sigma: 10
  save_soft_mask: true

alpha_blending_path01:
  # image: /path/to/original.png
  # foreground: /path/to/foreground.png
  # background: /path/to/background.png
  # mask: /path/to/hard_mask.png
  # soft_mask: /path/to/soft_mask.png
  output_dir: results/alpha_blending
  output_layout: task
  output_mode: blend_only
  kernel_size: 31
  sigma: 10
  save_soft_mask: false

alpha_blending_path02:
  dataset_root: /mnt/d/Ph.D/01_Experiments_GAN_Inv_Log/2026.03.08_All_Experiments_Start/_normalized_dataset
  output_dir: /mnt/d/Ph.D/01_Experiments_GAN_Inv_Log/2026.03.08_All_Experiments_Start/exper_12_alpha_blending
  output_layout: direct
  output_mode: blend_only
  kernel_size: 31
  sigma: 10
  save_soft_mask: false

# Split GT images into foreground/background images.
split_bg_fg_path01:
  dataset_root: /mnt/d/Ph.D/01_Experiments_GAN_Inv_Log/2026.03.08_All_Experiments_Start/_normalized_dataset
  output_dir: /mnt/d/Ph.D/01_Experiments_GAN_Inv_Log/2026.03.08_All_Experiments_Start/exper_13_fg_empty_lama_inpainting
  output_layout: direct
  output_mode: bg_only
  background_fill: transparent
  genders:
    - female
    - male
  refine_mask: false

# Copy-Paste composition baseline.
copy_paste_composition_path01:
  dataset_root: /mnt/d/Ph.D/01_Experiments_GAN_Inv_Log/2026.03.08_All_Experiments_Start/_normalized_dataset
  output_dir: /mnt/d/Ph.D/01_Experiments_GAN_Inv_Log/2026.03.08_All_Experiments_Start/exper_14_mask_copy_paste
  methods:
    - psp
    - e4e
    - pti
  genders:
    - female
    - male
  threshold: 127
