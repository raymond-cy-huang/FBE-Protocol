# Global path profiles used by task scripts.
#
# Profile naming convention:
# - fbe_extract_multi_masks_path00: repo-local default profile.
# - fbe_extract_multi_masks_path01: external/current experiment profile.
# - Add path02, path03, ... for additional input/output pairs.

# 00 keeps a review-friendly folder structure and writes both outputs:
# results/fbe_extract_multi_masks/{image_name}/{image_name}_mask.png
# results/fbe_extract_multi_masks/{image_name}/{image_name}_combine.png
fbe_extract_multi_masks_path00:
  # Default local test folder.
  input_dir: images
  output_dir: results

  # task: results/fbe_extract_multi_masks/{image_name}/...
  # direct: results/{image_name}/...
  output_layout: task

  # full: write mask + combine
  # mask_only: write mask only
  output_mode: full

# 01 is a flat bulk-output template for downstream experiments.
# Fill in input_dir/output_dir when using it:
# {output_dir}/{image_name}_mask.png
# No task folder, no per-image folder, no combine image.
fbe_extract_multi_masks_path01:
  # Current external test folders.
  # input_dir: your_input_folder
  # output_dir: your_output_folder
  output_layout: direct
  output_mode: mask_only

# Background swapping profiles.
#
# dataset_root mode expects:
# {dataset_root}/gt_mix_gender
# {dataset_root}/gt_female_mask
# {dataset_root}/gt_male_mask
#
# Output should stay task-scoped; per-run parameters belong in run metadata,
# not in folder names.
fbe_background_swapping01:
  dataset_root: /mnt/d/Ph.D/01_Experiments_GAN_Inv_Log/2026.03.08_All_Experiments_Start/_normalized_dataset
  output_dir: results
  output_layout: task

  # Pairing defaults.
  mask_region: background
  min_iou: -1
  anchor_count: 10
  max_pairs: 20
  pair_mask_size: 128
  variant_px: -1

fbe_background_swapping02:
  # dataset_root: /path/to/normalized_dataset
  output_dir: results
  output_layout: task

  # Pairing defaults.
  mask_region: background
  min_iou: -1
  anchor_count: 10
  max_pairs: 20
  pair_mask_size: 128
  variant_px: -1
