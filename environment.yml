name: fbe-protocol
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy<2
  - opencv
  - pillow
  - pyyaml
  - tqdm
  - scikit-image>=0.20
  - pytorch
  - torchvision
