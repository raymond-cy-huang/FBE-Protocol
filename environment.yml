      - openmim
      - lpips
      - onnx
      - onnxruntime
      - insightface
      - mmengine
      - xtcocotools
      - pycocotools
      - json-tricks
      - munkres
      - hydra-core>=1.3.2
      - iopath>=0.1.10
      - sparsemax>=0.1.9
      - loguru>=0.7.0
